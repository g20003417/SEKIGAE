<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席決めアプリ (Classroom Seating Master)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --seat-bg: #1e293b;
      --seat-empty: #0f172a;
      --board-bg: #064e3b;
      --board-border: #047857;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--card-border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary { background-color: #475569; }
    .btn-secondary:hover:not(:disabled) { background-color: #334155; }

    .btn-danger { background-color: var(--danger); }
    .btn-danger:hover:not(:disabled) { background-color: var(--danger-hover); }

    .btn-success { background-color: var(--success); }
    .btn-success:hover:not(:disabled) { background-color: #059669; }

    .btn-gas { background-color: #059669; }
    .btn-gas:hover:not(:disabled) { background-color: #047857; }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .draw-btn {
      font-size: 1.2rem;
      padding: 12px 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
    .draw-btn:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
      transform: translateY(-2px);
    }

    .reset-btn {
      font-size: 1rem;
      padding: 12px 20px;
      background-color: #475569;
    }

    /* 黒板 / 前方表示 */
    .classroom-container {
      width: 100%;
      max-width: 680px; /* 全体を小さくコンパクトに集約 */
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .blackboard {
      width: 75%;
      background-color: var(--board-bg);
      border: 3px solid var(--board-border);
      border-radius: 6px;
      color: #e2e8f0;
      text-align: center;
      padding: 8px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 16px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .blackboard::after {
      content: "▲ スクリーン・黒板（前方） ▲";
      display: block;
      font-size: 0.7rem;
      margin-top: 2px;
      color: #a7f3d0;
      letter-spacing: 1px;
    }

    /* 座席グリッド (6行x7列) - 座席サイズ小型化 */
    .seating-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      width: 100%;
    }

    /* 数字を大きく際立たせる新しい座席スタイル */
    .seat {
      aspect-ratio: 1; /* 正方形に近いコンパクトな形状 */
      background-color: var(--seat-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.65rem; /* 数字を大きく強調 */
      font-weight: 800;
      color: #94a3b8;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      user-select: none;
    }

    .seat-coord {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 0.6rem;
      color: var(--text-sub);
      font-weight: normal;
      opacity: 0.7;
    }

    .seat.empty {
      background-color: var(--seat-empty);
      border-style: dashed;
      opacity: 0.3;
    }
    .seat.empty::after {
      content: "空席";
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* 割り当て完了時の大きな数字デザイン */
    .seat.assigned {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      border: 2px solid #60a5fa;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* モーダル共通 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 90%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .close-btn:hover { color: white; }

    /* フォームスタイル */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
    }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    /* 空席ミニグリッド */
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .mini-seat {
      aspect-ratio: 1;
      background-color: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
    }
    .mini-seat.is-empty {
      background-color: #1e293b;
      color: #64748b;
      border-color: #475569;
      text-decoration: line-through;
    }

    /* 相性ルール設定リスト */
    .rule-item {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      flex-wrap: wrap;
    }
    .rule-item select, .rule-item input {
      padding: 6px 8px;
      background-color: #1e293b;
      border: 1px solid var(--card-border);
      color: white;
      border-radius: 4px;
    }
    .rule-item input[type="number"] { width: 65px; }
    .rule-item select { flex: 1; min-width: 180px; }
    .rule-text { font-size: 0.85rem; color: var(--text-sub); }

    /* エラーモーダル用 */
    .error-box {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 16px;
      color: #fca5a5;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* 印刷スタイル */
    @media print {
      body { background-color: white !important; color: black !important; padding: 0; }
      header, .controls, .modal-overlay, .btn { display: none !important; }
      .classroom-container { border: none !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; }
      .blackboard { background-color: #f1f5f9 !important; color: black !important; border: 2px solid black !important; }
      .blackboard::after { color: #475569 !important; }
      .seat { background: white !important; color: black !important; border: 2px solid black !important; }
      .seat.empty { background: #f8fafc !important; border-style: dashed !important; }
      .seat-coord { color: #64748b !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1>席替えマスター</h1>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-gas" onclick="openGasModal()">GAS連携設定</button>
      <button class="btn btn-secondary" onclick="openAuthModal()">管理画面</button>
    </div>
  </header>

  <div class="controls">
    <button class="btn draw-btn" id="drawBtn" onclick="drawSeats()">抽選スタート！</button>
    <button class="btn reset-btn" id="resetBtn" onclick="resetSeats()">リセット</button>
    <button class="btn btn-success" onclick="downloadCSV()">CSV保存</button>
    <button class="btn btn-secondary" onclick="window.print()">印刷</button>
  </div>

  <div class="classroom-container">
    <div class="blackboard"> FRONT / 黒板 </div>
    <div class="seating-grid" id="seatingGrid"></div>
  </div>

  <!-- パスワード認証モーダル -->
  <div class="modal-overlay" id="authModal">
    <div class="modal" style="max-width: 360px;">
      <div class="modal-header">
        <div class="modal-title">パスワード入力</div>
        <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
      </div>
      <form onsubmit="handleAuth(event)">
        <div class="form-group">
          <label class="form-label">管理画面パスワード</label>
          <input type="password" id="authPassword" class="form-input" placeholder="パスワードを入力" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;" id="loginBtn">ログイン</button>
      </form>
    </div>
  </div>

  <!-- 管理画面モーダル -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">管理画面設定</div>
        <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
      </div>
      
      <!-- 1. 空席指定 -->
      <div class="form-group">
        <label class="form-label">1. 空席の選択（タップして空席を切り替え）</label>
        <div class="mini-grid" id="miniGrid"></div>
      </div>

      <!-- 2 & 3. 番号範囲と欠番 -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">2. 開始番号</label>
          <input type="number" id="startNum" class="form-input" value="1" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">2. 終了番号</label>
          <input type="number" id="endNum" class="form-input" value="42" min="1">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">3. 欠番指定 (スペース・カンマ区切りで入力)</label>
        <input type="text" id="missingNums" class="form-input" placeholder="例: 4, 12, 25">
      </div>

      <!-- 4. 相性指示 -->
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label class="form-label" style="margin:0;">4. 条件・相性ルール指定</label>
          <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:0.85rem;" onclick="addRuleRow()">+ ルール追加</button>
        </div>
        <div id="rulesContainer"></div>
      </div>

      <!-- パスワード変更設定 -->
      <div class="form-group" style="border-top: 1px dashed var(--card-border); padding-top: 16px;">
        <label class="form-label">管理画面パスワードの変更（全端末に共通反映）</label>
        <div class="form-row">
          <input type="password" id="newPassword" class="form-input" placeholder="新しいパスワード（空欄で変更なし）">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
        <button class="btn btn-secondary" onclick="closeModal('adminModal')">キャンセル</button>
        <button class="btn" onclick="saveSettings()">設定を保存</button>
      </div>
    </div>
  </div>

  <!-- エラーモーダル -->
  <div class="modal-overlay" id="errorModal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title" style="color: var(--danger);">抽選エラー</div>
        <button class="close-btn" onclick="closeModal('errorModal')">&times;</button>
      </div>
      <div class="error-box" id="errorMessage">
        条件が厳しすぎるか、矛盾しているため配置パターンを生成できませんでした。
      </div>
      <div style="text-align: right;">
        <button class="btn btn-secondary" onclick="closeModal('errorModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- GAS連携設定モーダル -->
  <div class="modal-overlay" id="gasModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">GAS (Google Apps Script) 連携設定</div>
        <button class="close-btn" onclick="closeModal('gasModal')">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">GAS WebアプリURL (パスワード全端末同期用)</label>
        <input type="url" id="gasUrlInput" class="form-input" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn btn-success" style="width:100%; margin-bottom:16px;" onclick="saveGasUrl()">URLを保存</button>
      <div style="text-align: right; margin-top:16px;">
        <button class="btn btn-secondary" onclick="closeModal('gasModal')">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    const TOTAL_SEATS = ROWS * COLS;
    
    let currentAuthedPassword = "";

    let config = {
      emptySeats: new Array(TOTAL_SEATS).fill(false),
      startNum: 1,
      endNum: 42,
      missingNums: [],
      rules: []
    };

    let seatAssignment = new Array(TOTAL_SEATS).fill(null);

    window.addEventListener('DOMContentLoaded', () => {
      renderSeats();
      renderMiniGrid();
      const savedGasUrl = localStorage.getItem('gas_app_url') || "";
      document.getElementById('gasUrlInput').value = savedGasUrl;
    });

    function renderSeats() {
      const grid = document.getElementById('seatingGrid');
      grid.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const idx = r * COLS + c;
          const seatEl = document.createElement('div');
          seatEl.className = 'seat';
          if (config.emptySeats[idx]) {
            seatEl.classList.add('empty');
          } else if (seatAssignment[idx] !== null) {
            seatEl.classList.add('assigned');
            seatEl.innerText = seatAssignment[idx];
          }

          const coord = document.createElement('span');
          coord.className = 'seat-coord';
          coord.innerText = `${r+1}-${c+1}`;
          seatEl.appendChild(coord);

          grid.appendChild(seatEl);
        }
      }
    }

    function renderMiniGrid() {
      const grid = document.getElementById('miniGrid');
      grid.innerHTML = '';
      for (let i = 0; i < TOTAL_SEATS; i++) {
        const item = document.createElement('div');
        item.className = 'mini-seat' + (config.emptySeats[i] ? ' is-empty' : '');
        item.innerText = i + 1;
        item.onclick = () => {
          config.emptySeats[i] = !config.emptySeats[i];
          renderMiniGrid();
        };
        grid.appendChild(item);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openAuthModal() {
      document.getElementById('authPassword').value = '';
      openModal('authModal');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const pwdInput = document.getElementById('authPassword').value;
      const gasUrl = localStorage.getItem('gas_app_url');
      const loginBtn = document.getElementById('loginBtn');

      if (gasUrl) {
        loginBtn.innerText = "照合中...";
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'verifyPassword', password: pwdInput })
          });
          const json = await res.json();
          loginBtn.innerText = "ログイン";
          if (json.success) {
            currentAuthedPassword = pwdInput;
            closeModal('authModal');
            openAdminModal();
          } else {
            alert('パスワードが違います');
          }
        } catch (err) {
          loginBtn.innerText = "ログイン";
          alert('GAS通信失敗。初期パスワード（skg42）で照合します。');
          if (pwdInput === "skg42") {
            currentAuthedPassword = pwdInput;
            closeModal('authModal');
            openAdminModal();
          } else {
            alert('パスワードが違います');
          }
        }
      } else {
        if (pwdInput === "skg42") {
          currentAuthedPassword = pwdInput;
          closeModal('authModal');
          openAdminModal();
        } else {
          alert('パスワードが違います（初期パスワード: skg42）');
        }
      }
    }

    function openAdminModal() {
      renderMiniGrid();
      document.getElementById('startNum').value = config.startNum;
      document.getElementById('endNum').value = config.endNum;
      document.getElementById('missingNums').value = config.missingNums.join(' ');
      document.getElementById('newPassword').value = '';
      
      const container = document.getElementById('rulesContainer');
      container.innerHTML = '';
      config.rules.forEach(r => addRuleRow(r));

      openModal('adminModal');
    }

    // 新条件を追加したルール行生成関数
    function addRuleRow(data = { num1: '', num2: '', type: 'not_adjacent' }) {
      const container = document.getElementById('rulesContainer');
      const row = document.createElement('div');
      row.className = 'rule-item';
      
      const isSingleNumberRule = (type) => ['front_2rows', 'center_3cols'].includes(type);

      row.innerHTML = `
        <span class="rule-text">番号</span>
        <input type="number" class="rule-num1" value="${data.num1}" placeholder="A" min="1">
        <span class="rule-text target-b-label" style="display: ${isSingleNumberRule(data.type) ? 'none' : 'inline'};">を 番号</span>
        <input type="number" class="rule-num2" value="${data.num2 || ''}" placeholder="B" min="1" style="display: ${isSingleNumberRule(data.type) ? 'none' : 'inline-block'};">
        <span class="rule-text">の / を</span>
        <select class="rule-type" onchange="toggleRuleInputs(this)">
          <option value="not_adjacent" ${data.type === 'not_adjacent' ? 'selected' : ''}>隣り合わない位置（前後左右斜めNG）に配置</option>
          <option value="distance_2" ${data.type === 'distance_2' ? 'selected' : ''}>2席以上離れた位置に配置（全方向）</option>
          <option value="adjacent_side" ${data.type === 'adjacent_side' ? 'selected' : ''}>左右隣（横隣り）に配置</option>
          <option value="adjacent_any" ${data.type === 'adjacent_any' ? 'selected' : ''}>前後左右で隣り合う位置に配置</option>
          <option value="num1_side_dist2" ${data.type === 'num1_side_dist2' ? 'selected' : ''}>横（列）に2列以上間をあける</option>
          <option value="num1_vert_dist2" ${data.type === 'num1_vert_dist2' ? 'selected' : ''}>縦（行）に2行以上間をあける</option>
          <option value="num1_right" ${data.type === 'num1_right' ? 'selected' : ''}>右側に配置 (AがBの右)</option>
          <option value="num1_left" ${data.type === 'num1_left' ? 'selected' : ''}>左側に配置 (AがBの左)</option>
          <option value="num1_front" ${data.type === 'num1_front' ? 'selected' : ''}>前側に配置 (AがBの前)</option>
          <option value="num1_back" ${data.type === 'num1_back' ? 'selected' : ''}>後ろ側に配置 (AがBの後ろ)</option>
          <!-- 新規追加条件 -->
          <option value="front_2rows" ${data.type === 'front_2rows' ? 'selected' : ''}>前方2列目までに配置（前後の位置）</option>
          <option value="center_3cols" ${data.type === 'center_3cols' ? 'selected' : ''}>中央の3列に配置（左右の位置）</option>
        </select>
        <button type="button" class="btn btn-danger" style="padding:4px 8px;" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(row);
    }

    // 単一指定ルールの場合に「番号B」の入力欄を非表示にする制御
    function toggleRuleInputs(selectEl) {
      const parent = selectEl.parentElement;
      const num2Input = parent.querySelector('.rule-num2');
      const labelB = parent.querySelector('.target-b-label');
      const val = selectEl.value;

      if (['front_2rows', 'center_3cols'].includes(val)) {
        num2Input.style.display = 'none';
        if (labelB) labelB.style.display = 'none';
      } else {
        num2Input.style.display = 'inline-block';
        if (labelB) labelB.style.display = 'inline';
      }
    }

    async function saveSettings() {
      const start = parseInt(document.getElementById('startNum').value) || 1;
      const end = parseInt(document.getElementById('endNum').value) || 1;
      
      if (start > end) {
        alert('開始番号は終了番号以下にしてください。');
        return;
      }

      const missingStr = document.getElementById('missingNums').value.trim();
      let missingArr = missingStr ? missingStr.split(/[\s,、]+/) : [];
      missingArr = missingArr.map(n => parseInt(n)).filter(n => !isNaN(n) && n >= start && n <= end);
      missingArr = [...new Set(missingArr)];
      if (missingArr.length > 41) missingArr = missingArr.slice(0, 41);

      const ruleElements = document.querySelectorAll('.rule-item');
      const rules = [];
      ruleElements.forEach(el => {
        const n1 = parseInt(el.querySelector('.rule-num1').value);
        const n2 = parseInt(el.querySelector('.rule-num2').value);
        const type = el.querySelector('.rule-type').value;

        if (!isNaN(n1)) {
          if (['front_2rows', 'center_3cols'].includes(type)) {
            rules.push({ num1: n1, num2: null, type });
          } else if (!isNaN(n2)) {
            rules.push({ num1: n1, num2: n2, type });
          }
        }
      });

      const newPwd = document.getElementById('newPassword').value.trim();
      const gasUrl = localStorage.getItem('gas_app_url');

      if (newPwd) {
        if (gasUrl) {
          try {
            const res = await fetch(gasUrl, {
              method: 'POST',
              body: JSON.stringify({ action: 'changePassword', currentPassword: currentAuthedPassword, newPassword: newPwd })
            });
            const json = await res.json();
            if (json.success) {
              alert('全端末共通のパスワードを更新しました。');
              currentAuthedPassword = newPwd;
            } else {
              alert('パスワード更新エラー: ' + json.message);
            }
          } catch(err) {
            alert('GAS通信エラーのためパスワードは更新されませんでした。');
          }
        } else {
          alert('※GAS WebアプリURLが未登録のため、パスワード同期機能は無効です。');
        }
      }

      config.startNum = start;
      config.endNum = end;
      config.missingNums = missingArr;
      config.rules = rules;

      closeModal('adminModal');
      renderSeats();
    }

    function openGasModal() { openModal('gasModal'); }

    function saveGasUrl() {
      const url = document.getElementById('gasUrlInput').value.trim();
      localStorage.setItem('gas_app_url', url);
      alert('GAS URLを保存しました。');
      closeModal('gasModal');
    }

    function resetSeats() {
      seatAssignment = new Array(TOTAL_SEATS).fill(null);
      renderSeats();
    }

    // 焼きなまし法による超高速抽象ソルバー
    function drawSeats() {
      let students = [];
      for (let i = config.startNum; i <= config.endNum; i++) {
        if (!config.missingNums.includes(i)) students.push(i);
      }

      let availableSeats = [];
      for (let i = 0; i < TOTAL_SEATS; i++) {
        if (!config.emptySeats[i]) availableSeats.push(i);
      }

      if (students.length > availableSeats.length) {
        showError(`生徒数 (${students.length}名) が利用可能な席数 (${availableSeats.length}席) を超えています。`);
        return;
      }

      for (let rule of config.rules) {
        if (!students.includes(rule.num1) || (rule.num2 !== null && !students.includes(rule.num2))) {
          showError(`相性ルールで指定されている番号 (${rule.num1} ${rule.num2 ? 'または '+rule.num2 : ''}) が現在の生徒リストに含まれていません。`);
          return;
        }
      }

      const drawBtn = document.getElementById('drawBtn');
      drawBtn.disabled = true;
      drawBtn.innerText = "抽選中...";

      setTimeout(() => {
        let solution = solveBySimulatedAnnealing(students, availableSeats, config.rules);

        drawBtn.disabled = false;
        drawBtn.innerText = "抽選スタート！";

        if (solution) {
          seatAssignment = solution;
          renderSeats();
          sendResultToGAS(seatAssignment);
        } else {
          showError("条件が厳しすぎるか矛盾しているため、すべての条件を満たす座席配置が存在しません。管理画面で設定を見直してください。");
        }
      }, 30);
    }

    // ペナルティ計算（追加された新条件の判定を反映）
    function calculatePenalty(grid, rules) {
      let posMap = new Map();
      for (let i = 0; i < grid.length; i++) {
        if (grid[i] !== null) posMap.set(grid[i], i);
      }

      let penalty = 0;
      for (let rule of rules) {
        if (posMap.has(rule.num1)) {
          const p1 = posMap.get(rule.num1);
          const r1 = Math.floor(p1 / COLS), c1 = p1 % COLS;

          // 単一の生徒指定ルール
          if (rule.type === 'front_2rows') {
            if (r1 >= 2) penalty++; // 前方2列目＝0行目または1行目以外はペナルティ
            continue;
          }
          if (rule.type === 'center_3cols') {
            if (c1 < 2 || c1 > 4) penalty++; // 中央3列＝2,3,4列目 (0オリジンで3,4,5列目) 以外はペナルティ
            continue;
          }

          // 2人の生徒の組み合わせルール
          if (posMap.has(rule.num2)) {
            const p2 = posMap.get(rule.num2);
            const r2 = Math.floor(p2 / COLS), c2 = p2 % COLS;

            const dr = Math.abs(r1 - r2);
            const dc = Math.abs(c1 - c2);

            if (rule.type === 'not_adjacent' && dr <= 1 && dc <= 1) penalty++;
            else if (rule.type === 'distance_2' && dr <= 2 && dc <= 2) penalty++;
            else if (rule.type === 'adjacent_side' && (dr !== 0 || dc !== 1)) penalty++;
            else if (rule.type === 'adjacent_any' && dr + dc !== 1) penalty++;
            else if (rule.type === 'num1_side_dist2' && dc < 3) penalty++;
            else if (rule.type === 'num1_vert_dist2' && dr < 3) penalty++;
            else if (rule.type === 'num1_right' && c1 <= c2) penalty++;
            else if (rule.type === 'num1_left' && c1 >= c2) penalty++;
            else if (rule.type === 'num1_front' && r1 >= r2) penalty++;
            else if (rule.type === 'num1_back' && r1 <= r2) penalty++;
          }
        }
      }
      return penalty;
    }

    function solveBySimulatedAnnealing(students, availableSeats, rules) {
      for (let attempt = 0; attempt < 20; attempt++) {
        let grid = new Array(TOTAL_SEATS).fill(null);
        let shuffledStudents = [...students].sort(() => Math.random() - 0.5);
        let shuffledSeats = [...availableSeats].sort(() => Math.random() - 0.5);

        for (let i = 0; i < shuffledStudents.length; i++) {
          grid[shuffledSeats[i]] = shuffledStudents[i];
        }

        let currentPenalty = calculatePenalty(grid, rules);
        if (currentPenalty === 0) return grid;

        let temp = 100.0;
        let coolingRate = 0.995;

        for (let step = 0; step < 5000; step++) {
          let idxA = shuffledSeats[Math.floor(Math.random() * shuffledSeats.length)];
          let idxB = shuffledSeats[Math.floor(Math.random() * shuffledSeats.length)];

          let tempStudent = grid[idxA];
          grid[idxA] = grid[idxB];
          grid[idxB] = tempStudent;

          let newPenalty = calculatePenalty(grid, rules);

          if (newPenalty === 0) return grid;

          let delta = newPenalty - currentPenalty;
          if (delta < 0 || Math.exp(-delta / temp) > Math.random()) {
            currentPenalty = newPenalty;
          } else {
            let revert = grid[idxA];
            grid[idxA] = grid[idxB];
            grid[idxB] = revert;
          }

          temp *= coolingRate;
        }
      }
      return null;
    }

    async function sendResultToGAS(solution) {
      const gasUrl = localStorage.getItem('gas_app_url');
      if (!gasUrl) return;
      try {
        await fetch(gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveResult', result: solution })
        });
      } catch (e) {
        console.error("GAS保存エラー:", e);
      }
    }

    function showError(msg) {
      document.getElementById('errorMessage').innerText = msg;
      openModal('errorModal');
    }

    function downloadCSV() {
      if (seatAssignment.every(val => val === null)) {
        alert('先に抽選を実行してください。');
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,行/列,1列,2列,3列,4列,5列,6列,7列\n";
      for (let r = 0; r < ROWS; r++) {
        let rowStr = `${r + 1}行`;
        for (let c = 0; c < COLS; c++) {
          let idx = r * COLS + c;
          let val = config.emptySeats[idx] ? "空席" : (seatAssignment[idx] || "");
          rowStr += `,${val}`;
        }
        csvContent += rowStr + "\n";
      }
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `座席表_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
